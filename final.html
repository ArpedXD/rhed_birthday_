<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body class="relative min-h-dvh overflow-x-hidden bg-cream font-display text-ink antialiased">

    <div aria-hidden="true" class="pointer-events-none fixed inset-0">
        <span class="absolute left-[8%] top-[10%] size-3 rounded-full bg-pink-500 motion-safe:animate-bounce"></span>
        <span class="absolute left-[85%] top-[14%] size-4 rotate-12 rounded-sm bg-amber-400 motion-safe:animate-bounce" style="animation-delay: .3s"></span>
        <span class="absolute left-[18%] top-[48%] size-2.5 rounded-full bg-sky-400 motion-safe:animate-bounce" style="animation-delay: .6s"></span>
        <span class="absolute left-[92%] top-[55%] size-3 -rotate-12 rounded-sm bg-rose-400 motion-safe:animate-bounce" style="animation-delay: .9s"></span>
        <span class="absolute left-[10%] top-[82%] size-4 rotate-45 rounded-sm bg-orange-400 motion-safe:animate-bounce" style="animation-delay: .2s"></span>
        <span class="absolute left-[80%] top-[88%] size-3 rounded-full bg-violet-400 motion-safe:animate-bounce" style="animation-delay: .5s"></span>
    </div>

    <main class="relative mx-auto flex min-h-dvh max-w-2xl flex-col items-center justify-center gap-8 px-6 py-12 text-center sm:py-16">
        <figure class="w-full max-w-xs -rotate-2 rounded-2xl bg-white p-3 pb-4 shadow-xl ring-1 ring-black/5 transition-transform duration-300 hover:rotate-0 motion-reduce:transition-none">
            <div class="grid aspect-4/5 place-items-center overflow-hidden rounded-xl border-2 border-dashed border-rose-300 bg-rose-50 bg-[url('src/assets/gaykissing.png')]">

            </div>
            <figcaption class="mt-3 text-sm text-ink/70"></figcaption>
        </figure>

        <p class="max-w-prose text-lg leading-relaxed text-ink/80 text-pretty sm:text-xl">
            But all jokes aside, happy birthday bro, i wish you get that 200 gays you've always wished for
        </p>

        <h1 class="bg-linear-to-r from-pink-700 via-rose-600 to-orange-600 bg-clip-text pb-2 text-6xl font-extrabold leading-[0.95] tracking-tight text-transparent text-balance sm:text-7xl md:text-8xl">
            Happy<br>Birthday!
        </h1>

        <p class="text-xl font-medium text-ink/70">
            by your coolest reel sender: <span class="font-bold text-pink-700">Arp</span>
        </p>

    </main>

    <script type="module" src="/src/gay.ts"></script>
</body>
</html>
