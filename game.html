<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gay Questions</title>
</head>
<body class="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-4">
    <h1 class="text-center relative bottom-20 text-5xl text-white font-black">Gay Tester..</h1>
    <div id="quiz-card" class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 space-y-6">
        <h1 id="question" class="text-xl font-semibold text-white text-center">
            On average, how many reels do you send per day?
        </h1>

        <div id="choices" class="grid grid-cols-1 gap-3 *:cursor-pointer">
            <button id='1' class="choice-btn w-full px-4 py-3 rounded-xl bg-slate-700 text-white font-medium hover:bg-indigo-600 active:scale-95 transition">14</button>
            <button id='2' class="choice-btn w-full px-4 py-3 rounded-xl bg-slate-700 text-white font-medium hover:bg-indigo-600 active:scale-95 transition">20</button>
            <button id='3' class="choice-btn w-full px-4 py-3 rounded-xl bg-slate-700 text-white font-medium hover:bg-indigo-600 active:scale-95 transition">30</button>
            <button id='4' class="choice-btn w-full px-4 py-3 rounded-xl bg-slate-700 text-white font-medium hover:bg-indigo-600 active:scale-95 transition">40</button>
        </div>
    </div>

    <script type="module" src="/src/gay.ts"></script>
</body>
</html>
